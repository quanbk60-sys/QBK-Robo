<style>
/* Layout: full-bleed 3D stage, caption card docked bottom, player bar under it */
:root{--bg:#e6eaed;--panel:rgba(255,255,255,.94);--ink:#17202a;--muted:#56626d;--line:#cfd6dc;--brass:#99681a;--hot:#ff2d78;
 --f-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;--f-body:"Be Vietnam Pro",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}

.chap{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font:700 22px var(--f-display);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);padding:6px 14px;border-radius:6px}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(0,0,0,.08)} .prog i{display:block;height:100%;background:var(--brass);width:0}
.big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 34px;max-width:min(86vw,760px);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.big b{display:block;font:700 40px var(--f-display);text-wrap:balance}
.big span{display:block;margin-top:6px;color:var(--muted);font-size:18px}
.cap{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,980px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 18px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:grid;gap:3px}
.cap .n{font:700 14px var(--f-mono);color:var(--hot);letter-spacing:.06em;min-height:1em}
.cap .l1{font:600 20px var(--f-body)}
.cap .l2{font:500 18px var(--f-body);color:#2b3a48}
.jtag{position:fixed;transform:translate(14px,-130%);font:700 15px var(--f-mono);background:var(--hot);color:#fff;padding:3px 9px;border-radius:5px;white-space:nowrap;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.bar button{font:600 14px var(--f-body);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.bar button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.bar input[type=range]{flex:1;min-width:0;accent-color:#99681a}
.bar .tm{font:600 13px var(--f-mono);color:var(--muted);white-space:nowrap}
body.rec .bar{display:none} body.rec .cap{bottom:28px}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (max-width:640px){ .cap .l1{font-size:15px} .cap .l2{font-size:14px} .big b{font-size:26px} .big span{font-size:14px} .chap{font-size:16px} .bar .hide-s{display:none} }

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
await Promise.race([Promise.all(['700 12px "JetBrains Mono"','700 12px "Be Vietnam Pro"','800 12px "Be Vietnam Pro"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
const WC = { red:0xd83a2e, orange:0xf08a24, black:0x202020, yellow:0xf2c81e, green:0x2fa84f, purple:0x8a4fd0, blue:0x2f6fdc, brown:0x7a4a26, white:0xf0f0f0, grey:0x8a8f96 };
const HX=50, HZ=32, Y0=8, YF=82, YR=62, FR=14.3, R=0.8;
const yTop = x => YR + (x+HX)/(2*HX)*(YF-YR);
const SL = Math.atan2(YF-YR, 2*HX), CS=Math.cos(SL), SN=Math.sin(SL), RY0=yTop(0);
const roofW = (lx,ly,lz) => [lx*CS - ly*SN, RY0 + lx*SN + ly*CS, lz];

const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const M = (o) => new THREE.MeshStandardMaterial(o);
const mat = {
  brass: M({color:0xd9a441, metalness:1, roughness:0.3}),
  brassDark: M({color:0xb07a2a, metalness:1, roughness:0.38}),
  rubber: M({color:0x2a2b2f, roughness:0.85}),
  plastic: M({color:0xd8dadc, roughness:0.45, metalness:0.05}),
  darkPlastic: M({color:0x3a3d42, roughness:0.6}),
  pcbBlue: M({color:0x1d3f8a, roughness:0.6}), pcbBlack: M({color:0x141518, roughness:0.5}),
  pcbRed: M({color:0xb3262b, roughness:0.55}), pcbPurple: M({color:0x5e3a9a, roughness:0.6}),
  perf: M({color:0xc9a26a, roughness:0.7}), silver: M({color:0xc8ccd2, metalness:1, roughness:0.3}),
  batt: M({color:0x2a8a4a, roughness:0.4, metalness:0.2}), holder: M({color:0x18191b, roughness:0.7}),
  cap: M({color:0x1d2a5a, roughness:0.4}), motor: M({color:0xd8d8d8, metalness:0.9, roughness:0.35}),
  gearbox: M({color:0xc9a040, metalness:0.8, roughness:0.4}), fpc: M({color:0xd08a2a, roughness:0.5}),
  glass: new THREE.MeshPhysicalMaterial({color:0xfff2d8, roughness:0.05, transmission:0.85, transparent:true, opacity:0.4}),
  led: M({color:0xaaccff, transparent:true, opacity:0.8, roughness:0.2}),
  white: M({color:0xf2f2f2, roughness:0.5}),
};
const basic = c => new THREE.MeshBasicMaterial({color:c});

const world = new THREE.Group(); scene.add(world);
const roofG = new THREE.Group(); roofG.position.set(0, RY0, 0); roofG.rotation.z = SL; world.add(roofG);
const parts = {}; let cur = null;
function begin(id, parent=world){ const g = new THREE.Group(); g.name=id; parent.add(g); parts[id]=g; cur=g; return g; }
function add(m){ m.castShadow = true; m.receiveShadow = true; cur.add(m); return m; }
function box(w,h,d,m,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); return add(o); }
function cyl(r,h,m,x,y,z,axis='y',seg=28){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m); o.position.set(x,y,z); if(axis==='x')o.rotation.z=Math.PI/2; if(axis==='z')o.rotation.x=Math.PI/2; return add(o); }
function line(a,b,m=mat.brass,r=R){ const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,A.distanceTo(B),12),m);
  o.position.copy(A).add(B).multiplyScalar(.5); o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize()); return add(o); }
function densify(pts, step=3){ const out=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; out.push(a);
  const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]); const n=Math.floor(d/step); for(let k=1;k<n;k++){ const t=k/n; out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]); } } return out; }
function tube(pts, closed, m=mat.brass, r=R, dense=true){ const p = dense ? densify(pts) : pts;
  const curve = new THREE.CatmullRomCurve3(p.map(q=>new THREE.Vector3(...q)), closed, 'centripetal');
  return add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(40, p.length*3), r, 10, closed), m)); }
function fillet(P, r, seg=10){ const out=[], n=P.length;
  for(let i=0;i<n;i++){ const p=P[i], a=P[(i+n-1)%n], b=P[(i+1)%n];
    const ua=[a[0]-p[0],a[1]-p[1]], ub=[b[0]-p[0],b[1]-p[1]]; const la=Math.hypot(...ua), lb=Math.hypot(...ub);
    const u=[ua[0]/la,ua[1]/la], v=[ub[0]/lb,ub[1]/lb]; const th=Math.acos(Math.max(-1,Math.min(1,u[0]*v[0]+u[1]*v[1])));
    const t=r/Math.tan(th/2); const A=[p[0]+u[0]*t,p[1]+u[1]*t], B=[p[0]+v[0]*t,p[1]+v[1]*t];
    const bs=[u[0]+v[0],u[1]+v[1]], bl=Math.hypot(...bs); const C=[p[0]+bs[0]/bl*r/Math.sin(th/2), p[1]+bs[1]/bl*r/Math.sin(th/2)];
    let a0=Math.atan2(A[1]-C[1],A[0]-C[0]), a1=Math.atan2(B[1]-C[1],B[0]-C[0]); let d=a1-a0; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    for(let k=0;k<=seg;k++){ const an=a0+d*k/seg; out.push([C[0]+r*Math.cos(an), C[1]+r*Math.sin(an)]); } }
  return out; }
const rrect = (w,h,r) => fillet([[w/2,h/2],[-w/2,h/2],[-w/2,-h/2],[w/2,-h/2]], r, 6);

/* ---------- KHUNG ---------- */
const FRAME = ['side','crossBottom','crossFR','crossTop','rails','midRails','tray','posts','bezels','rearPosts','eyes'];
begin('side'); for(const z of [HZ,-HZ]) tube(fillet([[HX,Y0],[HX,YF],[-HX,YR],[-HX,Y0]],FR).map(([x,y])=>[x,y,z]), true);
begin('crossBottom'); for(const x of [34,-34]) line([x,Y0,-HZ],[x,Y0,HZ]);
begin('crossFR'); for(const y of [24,63]) line([HX,y,-HZ],[HX,y,HZ]); for(const y of [24,49]) line([-HX,y,-HZ],[-HX,y,HZ]);
const TOPF=[HX-20*CS, YF-20*SN], TOPR=[-HX+20*CS, YR+20*SN];
begin('crossTop'); for(const p of [TOPF,TOPR]) line([p[0],p[1],-HZ],[p[0],p[1],HZ]);
begin('rails'); for(const z of [15,-15]) line(roofW(-39,1.6,z), roofW(31,1.6,z));
begin('midRails'); for(const z of [HZ,-HZ]) line([-HX,42,z],[HX,42,z]);
begin('tray'); for(const z of [-22,0,22]) line([-40,Y0+1.6,z],[40,Y0+1.6,z]);
begin('posts'); for(const z of [HZ,-HZ]){ for(const x of [15,29,-36]) line([x,Y0,z],[x,42,z]); }
begin('bezels'); tube(rrect(62,39,3).map(([z,y])=>[HX+0.4,y+61.5,z]), true);
begin('rearPosts'); for(const z of [20,-20]) line([-HX,24,z],[-HX,49,z]);
begin('eyes'); for(const s of [1,-1]){ for(const [x,y] of [[-36,22.8],[-16,9.8],[2,9.8]]){ const t=new THREE.Mesh(new THREE.TorusGeometry(1.9,0.8,8,20),mat.brass); t.position.set(x,y,s*(HZ+1.6)); add(t); } }




/* ---------- BÁNH XÍCH ---------- */
const TZ=HZ+8, TW=12, S1={x:22,y:36.8,r:33}, S2={x:-36,y:22.8,r:19}, RW=[-16,2], RWY=9.8;
function trackPath(C1,C2,T=2.5){ const r1=C1.r+T, r2=C2.r+T, dx=C2.x-C1.x, dy=C2.y-C1.y, d=Math.hypot(dx,dy);
  const th=Math.atan2(dy,dx), al=Math.acos((r1-r2)/d), up=th+al, lo=th-al, N=160, pts=[];
  const P=(c,r,a)=>[c.x+r*Math.cos(a), c.y+r*Math.sin(a)];
  const A=P(C1,r1,up), B=P(C2,r2,up); for(let i=0;i<N;i++){const t=i/N; pts.push([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t]);}
  for(let i=0;i<N;i++) pts.push(P(C2,r2,up-(up-lo)*i/N));
  const C=P(C2,r2,lo), D=P(C1,r1,lo); for(let i=0;i<N;i++){const t=i/N; pts.push([C[0]+(D[0]-C[0])*t, C[1]+(D[1]-C[1])*t]);}
  const end=up-2*Math.PI; for(let i=0;i<N;i++) pts.push(P(C1,r1,lo-(lo-end)*i/N));
  return pts; }
function gear(cx,cy,z,r,teeth,th,m){ const g=new THREE.Group(); g.position.set(cx,cy,z); cur.add(g);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r-3,2.2,12,64),m); g.add(ring);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(5,5,th+2,24),m); hub.rotation.x=Math.PI/2; g.add(hub);
  for(let i=0;i<6;i++){ const a=i*Math.PI/3, sp=new THREE.Mesh(new THREE.BoxGeometry(r-6,3,th*0.7),m); sp.position.set(Math.cos(a)*(r-6)/2,Math.sin(a)*(r-6)/2,0); sp.rotation.z=a; g.add(sp); }
  for(let i=0;i<teeth;i++){ const a=i*2*Math.PI/teeth, t=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.6,th),m); t.position.set(Math.cos(a)*(r-0.4),Math.sin(a)*(r-0.4),0); t.rotation.z=a; g.add(t); }
  g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; } }); }
begin('drive'); for(const s of [1,-1]){ gear(S1.x,S1.y,s*TZ,S1.r,64,4,mat.plastic); line([S1.x,S1.y,s*(HZ-1)],[S1.x,S1.y,s*(TZ+2)],mat.silver,1.5); }
begin('idler'); for(const s of [1,-1]){ gear(S2.x,S2.y,s*TZ,S2.r,30,4,mat.darkPlastic); line([S2.x,S2.y,s*HZ],[S2.x,S2.y,s*(TZ+4)],mat.silver,1.5); }
begin('road'); for(const s of [1,-1]){ for(const x of RW){ cyl(6,10,mat.darkPlastic,x,RWY,s*TZ,'z'); line([x,RWY,s*HZ],[x,RWY,s*(TZ+6)],mat.silver,1.2); } }
begin('track'); for(const s of [1,-1]){ const p=trackPath(S2,S1); let acc=0; const seg=[0];
  for(let i=1;i<p.length;i++){ acc+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); seg.push(acc); }
  let j=0; const padG=new THREE.BoxGeometry(4.4,2.6,TW), gripG=new THREE.BoxGeometry(1.4,1.6,TW*0.9);
  for(let L=0; L<acc; L+=5.2){ while(seg[j+1]<L && j<p.length-2) j++;
    const a=p[j], b=p[(j+1)%p.length], ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    const pad=new THREE.Mesh(padG,mat.rubber); pad.position.set(a[0],a[1],s*TZ); pad.rotation.z=ang; add(pad);
    const gr=new THREE.Mesh(gripG,mat.rubber); gr.position.set(a[0]+Math.sin(ang)*1.9, a[1]-Math.cos(ang)*1.9, s*TZ); gr.rotation.z=ang; cur.add(gr); } }


/* =====================================================================
   MODULE THẬT: mạch in có chữ chân, lỗ hàn, chip; dây hàn vào đúng lỗ
   ===================================================================== */
const PX = 18; // pixel / mm cho texture
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
function circ(ctx,x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function rrectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function texFrom(c){ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function canvasFor(w,d){ const c=document.createElement('canvas'); c.width=Math.round(w*PX); c.height=Math.round(d*PX); return c; }
const MONO='"JetBrains Mono",ui-monospace,Menlo,monospace', SANS='"Be Vietnam Pro",Arial,sans-serif';

/* def: {w,d,t,color,silk,pads:[[name,x,z,{text,align,off,fs,col}]],holes,draw(ctx,P,mm),extra(g,top)} */
function pcb(def){
  const g=new THREE.Group(); const c=canvasFor(def.w,def.d), x=c.getContext('2d');
  const P=(mx,mz)=>[(mx+def.w/2)*PX,(mz+def.d/2)*PX]; const mm=v=>v*PX;
  x.fillStyle=def.color; x.fillRect(0,0,c.width,c.height);
  if(def.perf){ x.fillStyle='rgba(0,0,0,.28)'; for(let i=1.27;i<def.w;i+=2.54) for(let j=1.27;j<def.d;j+=2.54){ circ(x,mm(i),mm(j),mm(0.42)); } x.fillStyle='rgba(205,160,70,.55)'; for(let i=1.27;i<def.w;i+=2.54) for(let j=1.27;j<def.d;j+=2.54){ x.beginPath(); x.arc(mm(i),mm(j),mm(0.75),0,Math.PI*2); x.lineWidth=mm(0.25); x.strokeStyle='rgba(190,140,60,.6)'; x.stroke(); } }
  (def.holes||[]).forEach(([hx,hz,r])=>{ const [px,py]=P(hx,hz); x.fillStyle='#e2c36a'; circ(x,px,py,mm(r+0.55)); x.fillStyle='#1a1a1a'; circ(x,px,py,mm(r)); });
  def.draw && def.draw(x,P,mm);
  for(const [name,px0,pz0,o={}] of def.pads){ const [cx,cy]=P(px0,pz0);
    x.fillStyle='#e9c35c'; circ(x,cx,cy,mm(0.95)); x.fillStyle='#3b3020'; circ(x,cx,cy,mm(0.45));
    if(o.text!==''){ x.fillStyle=o.col||def.silk||'#f4f4f4'; x.font=`700 ${mm(o.fs||1.25)}px ${MONO}`; x.textBaseline='middle'; x.textAlign=o.align||'left';
      const off=o.off||[1.45,0]; x.fillText(o.text||name, cx+mm(off[0]), cy+mm(off[1])); } }
  const top=new THREE.MeshStandardMaterial({map:texFrom(c), roughness:.5, metalness:.05});
  // mặt dưới: lỗ hàn + tên chân (nhìn từ phía hàn dây)
  const c2=canvasFor(def.w,def.d), x2=c2.getContext('2d'); const Q=(mx,mz)=>[(mx+def.w/2)*PX,(def.d/2-mz)*PX];
  x2.fillStyle=def.edge||def.color; x2.fillRect(0,0,c2.width,c2.height); x2.fillStyle='rgba(0,0,0,.18)'; x2.fillRect(0,0,c2.width,c2.height);
  for(const [name,px0,pz0,o={}] of def.pads){ const [cx,cy]=Q(px0,pz0); x2.fillStyle='#e9c35c'; circ(x2,cx,cy,mm(1.0)); x2.fillStyle='#3b3020'; circ(x2,cx,cy,mm(0.45));
    if(o.text!==''){ x2.fillStyle='#ffffff'; x2.font=`700 ${mm((o.fs||1.25)*0.95)}px ${MONO}`; x2.textBaseline='middle'; const off=o.off||[1.45,0]; x2.save(); x2.translate(cx+mm(off[0]), cy-mm(off[1])); x2.scale(-1,1); x2.textAlign=o.align==='right'?'left':o.align==='center'?'center':'right'; x2.fillText(o.text||name,0,0); x2.restore(); } }
  const bot=new THREE.MeshStandardMaterial({map:texFrom(c2), roughness:.6});
  const side=new THREE.MeshStandardMaterial({color:def.edge||def.color, roughness:.65});
  const m=new THREE.Mesh(new THREE.BoxGeometry(def.w,def.t,def.d),[side,side,top,bot,side,side]); m.castShadow=m.receiveShadow=true; g.add(m);
  def.extra && def.extra(g, def.t/2);
  g.userData.def=def; return g;
}
const BASIS={ up:[[1,0,0],[0,1,0],[0,0,1]], roof:[[0,0,-1],[0,1,0],[1,0,0]], front:[[0,0,-1],[1,0,0],[0,-1,0]],
  left:[[-1,0,0],[0,0,-1],[0,-1,0]], right:[[1,0,0],[0,0,1],[0,-1,0]], back:[[0,0,1],[-1,0,0],[0,-1,0]] };

function addTo(g, mesh){ mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh); return mesh; }
function gbox(g,w,h,d,m,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); return addTo(g,o); }

function labelTex(w,d,bg,draw){ const c=canvasFor(w,d), x=c.getContext('2d'); x.fillStyle=bg; x.fillRect(0,0,c.width,c.height); draw(x,v=>v*PX); return new THREE.MeshStandardMaterial({map:texFrom(c), roughness:.45}); }
function topTexBox(g,w,h,d,bg,draw,x,y,z,sideCol,metal=0){ const top=labelTex(w,d,bg,draw); top.metalness=metal; const s=new THREE.MeshStandardMaterial({color:sideCol||bg, roughness:.5, metalness:metal});

JOINTS.forEach((j,i)=>j.n=i+1);
// thời điểm hàn mỗi đầu dây
WIRES.forEach(w=>{ w.ta=JOINTS.find(j=>j.wire===w&&j.end===0).t0; w.tb=JOINTS.find(j=>j.wire===w&&j.end===1).t0; });

/* ---------- vòng chỉ chỗ hàn ---------- */
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.35,10,40),new THREE.MeshBasicMaterial({color:0xff2d78,depthTest:false,transparent:true}));
ring.renderOrder=999; scene.add(ring); ring.visible=false;
const ring2=new THREE.Mesh(new THREE.RingGeometry(0,1.1,24),new THREE.MeshBasicMaterial({color:0xff2d78,depthTest:false,transparent:true,opacity:.45,side:THREE.DoubleSide}));
ring2.renderOrder=999; scene.add(ring2); ring2.visible=false;

/* ---------- module xuất hiện ---------- */
const SHOWT={}; CH.forEach(c=>c.show.forEach(id=>SHOWT[id]=c.t0));
const BASEPOS={}; for(const id of Object.keys(SHOWT)) BASEPOS[id]=allMods[id].position.clone();

/* ---------- camera ---------- */
const cam=new THREE.PerspectiveCamera(30,16/9,1,4000);
function jointCam(j){ const e=j.e, p=e.pos.clone(); let n=e.lead.clone().sub(e.pos); if(n.lengthSq()<1e-6) n.set(0,1,0); n.normalize();
  let dir;
  if(e.mod==='perf'){ dir=V3(0.45,-0.42,Math.sign(p.z)||1).normalize(); }
  else { dir=n.clone().add(V3(0.15,0.55,0)); if(Math.abs(dir.x)<0.2&&Math.abs(dir.z)<0.2) dir.add(V3(0.5,0,0.3)); dir.normalize(); }
  return [p.clone().add(dir.multiplyScalar(e.mod==='perf'?150:140)), p]; }
const ease=k=>k<0?0:k>1?1:k*k*(3-2*k);
const camAt=t=>{ // trả về [pos,target]
  let cur=null, prev=null; for(const ev of EV){ if(ev.t0<=t) { prev=cur; cur=ev; } else break; }
  const target=ev=>{ if(ev.type==='intro'||ev.type==='end'){ const a=(ev.type==='intro'?0.6:2.2)+((t-ev.t0)/ev.dur)*1.2; return [V3(Math.cos(a)*300,170,Math.sin(a)*300), V3(0,42,0)]; }
    if(ev.type==='chapter'){ const c=CH[ev.ci].cam; return [V3(...c[0]),V3(...c[1])]; }
    return jointCam(ev.j); };
  const b=target(cur); if(!prev || cur.type==='intro') return b;
  const a=target({...prev, t0:prev.t0}); const k=ease((t-cur.t0)/TMOVE); if(k>=1) return b;
  // giữ điểm đầu tại thời điểm cuối của sự kiện trước
  const ap = prev.type==='intro' ? (()=>{ const aa=0.6+1.2; return [V3(Math.cos(aa)*300,170,Math.sin(aa)*300),V3(0,42,0)]; })() : a;
  return [ap[0].clone().lerp(b[0],k), ap[1].clone().lerp(b[1],k)]; };

/* ---------- che khuất: làm mờ vật chắn ---------- */
const ghostMat=new THREE.MeshBasicMaterial({color:0x9aa6b1,transparent:true,opacity:0.12,depthWrite:false});
const ray=new THREE.Raycaster(); let ghosted=[];
const wireSet=new Set(); WIRES.forEach(w=>{ wireSet.add(w.mesh); w.blobs.forEach(b=>wireSet.add(b)); });
function unghost(){ ghosted.forEach(([o,m])=>o.material=m); ghosted=[]; }
function ghostBetween(from,to,keepMod){ const dir=to.clone().sub(from); const dist=dir.length(); ray.set(from,dir.normalize()); ray.far=dist-3;
  const keep=keepMod?allMods[keepMod]:null;
  const hits=ray.intersectObjects([world],true);
  for(const h of hits){ const o=h.object; if(!o.isMesh||!o.visible||wireSet.has(o)||o===ring||o.material===ghostMat) continue; let p=o, mine=false; while(p){ if(p===keep){mine=true;break;} p=p.parent; } if(mine) continue;
    if(o.material===frameMat) continue; ghosted.push([o,o.material]); o.material=ghostMat; } }

/* ---------- trạng thái tại thời điểm t ---------- */
const capEl={ch:document.getElementById('cChap'),n:document.getElementById('cNum'),l1:document.getElementById('cL1'),l2:document.getElementById('cL2'),tag:document.getElementById('jtag'),title:document.getElementById('bigTitle'),bar:document.getElementById('pbar')};
let anyVisible=(t,id)=>t>=SHOWT[id];
function setState(t,live=false){
  // module
  for(const id of Object.keys(SHOWT)){ const g=allMods[id]; const k=(t-SHOWT[id])/0.9; g.visible=k>=0; if(k>=0){ const d=(1-ease(k))*30; g.position.copy(BASEPOS[id]); g.position.y+=d; } }
  // dây
  for(const w of WIRES){ const idx=w.geo.index.count; let f=0;
    if(t>=w.tb) f=0.12+0.88*ease((t-w.tb)/TMOVE); else if(t>=w.ta) f=0.12*ease((t-w.ta)/0.8);
    if(w.tb<w.ta) f = t>=w.ta?1:0;
    w.mesh.visible=f>0; w.geo.setDrawRange(0, Math.floor(f*idx/6)*6);
    w.blobs[0].visible=t>=w.ta+0.9; w.blobs[1].visible=t>=w.tb+0.9; }
  // sự kiện hiện tại
  let cur=EV[0]; for(const ev of EV){ if(ev.t0<=t) cur=ev; else break; }
  const [cp,ct]=camAt(t); cam.position.copy(cp); cam.lookAt(ct); cam.updateMatrixWorld();
  unghost(); ring.visible=ring2.visible=false; capEl.tag.hidden=true;
  const ci = cur.ci!==undefined ? cur.ci : (cur.type==='end'?CH.length-1:-1);
  capEl.ch.textContent = ci>=0 ? `Chương ${ci+1}/${CH.length} · ${CH[ci].title}` : 'QBK-Robo · Video lắp ráp';
  capEl.bar.style.width=(t/TOTAL*100).toFixed(2)+'%';
  capEl.title.hidden=true;
  if(cur.type==='intro'){ capEl.title.hidden=false; capEl.title.innerHTML=`<b>QBK-Robo</b><span>Lắp ráp, hàn và cắm từng mối · ${NJ} mối nối, ${CH.length} chương</span>`; capEl.n.textContent=''; capEl.l1.textContent='Khung đồng đã hàn xong (phần A trong sổ tay).'; capEl.l2.textContent='Phía module: hàn dây vào mặt dưới lỗ chân. Phía ESP32: cắm đầu Dupont cái. Chân GPIO là bản tạm, chờ sơ đồ board của shop.'; }
  else if(cur.type==='chapter'){ const c=CH[cur.ci]; capEl.title.hidden=false; capEl.title.innerHTML=`<b>Chương ${cur.ci+1} · ${c.title}</b><span>${c.sub}</span>`; capEl.n.textContent=''; capEl.l1.textContent=c.sub; capEl.l2.textContent=''; }
  else if(cur.type==='joint'){ const j=cur.j; capEl.n.textContent=`MỐI ${j.n} / ${NJ}`; capEl.l1.textContent=j.l1; capEl.l2.textContent=j.l2;
    if(t-cur.t0>TMOVE*0.6){ ring.visible=ring2.visible=true; ring.position.copy(j.e.pos); ring2.position.copy(j.e.pos); ring.lookAt(cam.position); ring2.lookAt(cam.position);
      const s=live?1+0.18*Math.sin(t*7):1.1; ring.scale.setScalar(s);
      const v=j.e.pos.clone().project(cam); const W2=innerWidth, H2=innerHeight; capEl.tag.hidden=false; capEl.tag.textContent=j.e.label; capEl.tag.style.left=((v.x+1)/2*W2)+'px'; capEl.tag.style.top=((1-v.y)/2*H2)+'px'; }
    ghostBetween(cam.position, j.e.pos, j.e.mod); }
  else if(cur.type==='end'){ capEl.title.hidden=false; capEl.title.innerHTML=`<b>Xong phần hàn</b><span>Tiếp theo: lắp bánh xích, nạp firmware</span>`; capEl.n.textContent=''; capEl.l1.textContent=`Tổng cộng ${NJ} mối nối.`; capEl.l2.textContent='Soát lại: không mối trần nào chạm khung đồng, mọi mối bọc co nhiệt.'; }
  return cur; }
function frameKey(t){ let cur=EV[0]; for(const ev of EV){ if(ev.t0<=t) cur=ev; else break; } const lt=t-cur.t0;
  if((cur.type==='joint'||cur.type==='chapter') && lt>1.25) return cur.type+cur.t0; return null; }

/* =====================================================================
   SÂN KHẤU + TRÌNH PHÁT
   ===================================================================== */
const REC=location.hash==='#rec'; if(REC) document.body.classList.add('rec');
stageEl.appendChild(renderer.domElement);
const frameIds=['side','crossBottom','crossFR','crossTop','rails','midRails','tray','posts','bezels','rearPosts','eyes'];
const frameMat=mat.brass.clone(); frameMat.transparent=true; frameMat.opacity=0.35; frameMat.depthWrite=false;
for(const id of frameIds) parts[id].traverse(o=>{ if(o.isMesh){ o.material=frameMat; o.castShadow=false; } });
for(const id of ['track','road','idler','drive']) parts[id].visible=false;
scene.background=new THREE.Color(0xe6eaed);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshStandardMaterial({color:0xd0d7dc,roughness:.95}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.6; ground.receiveShadow=true; scene.add(ground);
scene.add(new THREE.HemisphereLight(0xffffff,0x40382f,0.8));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(140,260,170); sun.castShadow=!REC; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:10,far:700}); scene.add(sun);
const f1=new THREE.DirectionalLight(0xc8d6ff,0.8); f1.position.set(-160,120,-140); scene.add(f1);
const f2=new THREE.DirectionalLight(0xffffff,0.6); f2.position.set(-100,140,200); scene.add(f2);
const f3=new THREE.DirectionalLight(0xffffff,0.4); f3.position.set(60,-80,0); scene.add(f3);
if(REC) renderer.shadowMap.enabled=false;
function resize(){ renderer.setPixelRatio(REC?1:Math.min(devicePixelRatio||1,2)); renderer.setSize(innerWidth,innerHeight,false); cam.aspect=innerWidth/innerHeight; cam.fov=Math.max(30,Math.min(50,30*1.6/Math.min(cam.aspect,1.6))); cam.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
document.getElementById('loading').remove();

let t=0, playing=false, speed=1, last=performance.now();
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const $=id=>document.getElementById(id);
function draw(){ setState(t,!REC); renderer.render(scene,cam); $('scrub').value=Math.round(t/TOTAL*1000); $('tm').textContent=`${fmt(t)} / ${fmt(TOTAL)}`; }
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.1,(now-last)/1000); last=now; if(playing){ t=Math.min(TOTAL,t+dt*speed); if(t>=TOTAL) setPlay(false); } if(!REC) draw(); }
function setPlay(v){ playing=v; $('bPlay').textContent=v?'⏸ Dừng':'▶ Phát'; }
$('bPlay').onclick=()=>{ if(t>=TOTAL) t=0; setPlay(!playing); };
const jt=()=>EV.filter(e=>e.type==='joint'||e.type==='chapter').map(e=>e.t0);
$('bNext').onclick=()=>{ const n=jt().find(x=>x>t+0.05); if(n!==undefined) t=n; setPlay(false); };
$('bPrev').onclick=()=>{ const a=jt().filter(x=>x<t-0.3); if(a.length) t=a[a.length-1]; setPlay(false); };
$('bSpeed').onclick=e=>{ speed = speed===1?0.5:speed===0.5?2:1; e.currentTarget.textContent=speed+'×'; };
$('scrub').oninput=e=>{ t=e.target.value/1000*TOTAL; };
addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); $('bPlay').click(); } if(e.key==='ArrowRight') $('bNext').click(); if(e.key==='ArrowLeft') $('bPrev').click(); });
requestAnimationFrame(loop);
window.__TOTAL=TOTAL; window.__NJ=NJ;
window.__render=(tt)=>{ t=tt; setState(t,false); renderer.render(scene,cam); };
window.__key=frameKey;
window.__done=true;
</script>
