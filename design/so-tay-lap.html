<style>
/* Layout: workshop manual — 3D bench on the left, step card on the right; stacked on phones */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#182028; --surface-2:#1d2630; --ink:#e6e9ec; --muted:#9aa6b1; --line:#2a343e;
  --brass:#e0aa4a; --brass-soft:#3a2e18; --stage:#0e1317; --ground:#1a2027; --ok:#57c08a; --warn:#f08a5a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#182028; --surface-2:#1d2630; --ink:#e6e9ec; --muted:#9aa6b1; --line:#2a343e;
  --brass:#e0aa4a; --brass-soft:#3a2e18; --stage:#0e1317; --ground:#1a2027; --ok:#57c08a; --warn:#f08a5a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.app{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);height:100%}
.stage{position:relative;background:var(--stage);min-height:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stage-tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chipbtn{font:500 13px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.chipbtn:focus-visible,.navbtn:focus-visible,.tab:focus-visible,.sdot:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 11.5px var(--f-mono);background:var(--surface);color:var(--ink);border:1px solid var(--brass);padding:2px 6px;border-radius:4px;white-space:nowrap}
.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:4px;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:600 14px var(--f-body);background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.scroll{flex:1;overflow-y:auto;min-height:0}
.pad{padding-block:18px 24px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.phase{font:600 12px var(--f-body);text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted);cursor:pointer;min-width:0}
.phase b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink)}
.phase[aria-current="true"]{border-color:var(--brass);background:var(--brass-soft)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.sdot{font:600 12px var(--f-mono);min-width:34px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.sdot.done{color:var(--ok);border-color:var(--ok)}
.sdot[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.step h2{font-size:28px;line-height:1.15;margin:4px 0 8px}
.goal{color:var(--muted);margin:0 0 16px;max-width:62ch}
.blk{margin:0 0 18px}
.blk h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.blk ul,.blk ol{margin:0;padding-left:22px;display:grid;gap:6px;max-width:66ch}
.blk ol li::marker{font-family:var(--f-mono);color:var(--brass)}
.checks{list-style:none;padding:0!important}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--ok);width:16px;height:16px;flex:none}
.tip{border-left:3px solid var(--brass);background:var(--surface-2);padding:10px 12px;border-radius:0 8px 8px 0;max-width:66ch}
.tip b{color:var(--brass)}
.warn{border-left-color:var(--warn)} .warn b{color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.m,.m{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:inline-block;width:22px;height:8px;border-radius:4px;vertical-align:1px;margin-right:6px;border:1px solid rgba(127,127,127,.5)}
.nav{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 16px;border-top:1px solid var(--line);background:var(--surface)}
.navbtn{flex:1;font:600 14px var(--f-body);padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.navbtn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.navbtn:disabled{opacity:.4;cursor:default}
.ref h2{font-size:24px;margin:0 0 6px}
.ref p{max-width:66ch;color:var(--muted);margin:0 0 14px}
.ref section{margin-bottom:28px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.colors div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
@media (max-width:860px){
  .app{display:block;height:auto}
  .stage{position:sticky;top:0;height:46vh;z-index:2;border-bottom:1px solid var(--line)}
  .panel{border-left:0}
  .scroll{overflow:visible}
  .nav{position:sticky;bottom:0}
  .step h2{font-size:24px}
  .brand b{font-size:18px}
  .legend{display:none}
  .brand{display:none}
  .stage-tools{top:auto;bottom:10px}
  .phases{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <div class="loading" id="loading">Đang dựng mô hình 3D…</div>
    <div class="labels" id="labels"></div>
    <div class="brand"><b>QBK-Robo</b><span>Sổ tay lắp · khung đồng Ø1,6</span></div>

  </div>

  <div class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="steps">Các bước</button>

      <button class="tab" role="tab" aria-selected="false" data-tab="cuts">Cắt đồng</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="wiring">Đi dây đẹp</button>
    </div>
    <div class="scroll" id="scroll">
      <div class="pad" id="tab-steps">
        <div class="phases" id="phases"></div>
        <div class="dots" id="dots"></div>

      </div>
      <div class="pad ref" id="tab-pins" hidden></div>

    <div class="nav" id="nav">
      <button class="navbtn" id="prevBtn">← Bước trước</button>
      <button class="navbtn primary" id="nextBtn">Bước tiếp →</button>
    </div>
  </div>
</div>

 {id:'c1', ph:'C', cam:'insideL', title:'Đế pin vào khay đáy',

  check:['Cắm được cáp USB-C từ phía sau.','Gạt công tắc dễ, không chạm mạch sạc.'], labels:'c2'},
 {id:'c3', ph:'C', cam:'insideL', title:'Thanh nguồn chia 5V và GND',
  goal:'Mọi dây nguồn đi ra từ một điểm, dễ kiểm tra và đi dây gọn.',

/* =====================================================================
   3D: kích thước khung (mm). Gốc toạ độ: giữa thân, mặt đất y = 0.
   x: về phía trước, y: lên trên, z: sang phải
   ===================================================================== */
const HX=50, HZ=32, Y0=8, YF=82, YR=62, FR=14.3, R=0.8;
const yTop = x => YR + (x+HX)/(2*HX)*(YF-YR);
const SL = Math.atan2(YF-YR, 2*HX), CS=Math.cos(SL), SN=Math.sin(SL), RY0=yTop(0);
const roofW = (lx,ly,lz) => [lx*CS - ly*SN, RY0 + lx*SN + ly*CS, lz];

const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const M = (o) => new THREE.MeshStandardMaterial(o);
const mat = {
  brass: M({color:0xd9a441, metalness:1, roughness:0.3}),
  brassDark: M({color:0xb07a2a, metalness:1, roughness:0.38}),
  rubber: M({color:0x2a2b2f, roughness:0.85}),
  plastic: M({color:0xd8dadc, roughness:0.45, metalness:0.05}),
  darkPlastic: M({color:0x3a3d42, roughness:0.6}),
  pcbBlue: M({color:0x1d3f8a, roughness:0.6}), pcbBlack: M({color:0x141518, roughness:0.5}),
  pcbRed: M({color:0xb3262b, roughness:0.55}), pcbPurple: M({color:0x5e3a9a, roughness:0.6}),
  perf: M({color:0xc9a26a, roughness:0.7}), silver: M({color:0xc8ccd2, metalness:1, roughness:0.3}),
  batt: M({color:0x2a8a4a, roughness:0.4, metalness:0.2}), holder: M({color:0x18191b, roughness:0.7}),
  cap: M({color:0x1d2a5a, roughness:0.4}), motor: M({color:0xd8d8d8, metalness:0.9, roughness:0.35}),
  gearbox: M({color:0xc9a040, metalness:0.8, roughness:0.4}), fpc: M({color:0xd08a2a, roughness:0.5}),
  glass: new THREE.MeshPhysicalMaterial({color:0xfff2d8, roughness:0.05, transmission:0.85, transparent:true, opacity:0.4}),
  led: M({color:0xaaccff, transparent:true, opacity:0.8, roughness:0.2}),
  white: M({color:0xf2f2f2, roughness:0.5}),
};
const basic = c => new THREE.MeshBasicMaterial({color:c});

const world = new THREE.Group(); scene.add(world);
const roofG = new THREE.Group(); roofG.position.set(0, RY0, 0); roofG.rotation.z = SL; world.add(roofG);
const parts = {}; let cur = null;
function begin(id, parent=world){ const g = new THREE.Group(); g.name=id; parent.add(g); parts[id]=g; cur=g; return g; }
function add(m){ m.castShadow = true; m.receiveShadow = true; cur.add(m); return m; }
function box(w,h,d,m,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); return add(o); }
function cyl(r,h,m,x,y,z,axis='y',seg=28){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m); o.position.set(x,y,z); if(axis==='x')o.rotation.z=Math.PI/2; if(axis==='z')o.rotation.x=Math.PI/2; return add(o); }
function line(a,b,m=mat.brass,r=R){ const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,A.distanceTo(B),12),m);
  o.position.copy(A).add(B).multiplyScalar(.5); o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize()); return add(o); }
function densify(pts, step=3){ const out=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; out.push(a);
  const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]); const n=Math.floor(d/step); for(let k=1;k<n;k++){ const t=k/n; out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]); } } return out; }
function tube(pts, closed, m=mat.brass, r=R, dense=true){ const p = dense ? densify(pts) : pts;
  const curve = new THREE.CatmullRomCurve3(p.map(q=>new THREE.Vector3(...q)), closed, 'centripetal');
  return add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(40, p.length*3), r, 10, closed), m)); }
function fillet(P, r, seg=10){ const out=[], n=P.length;
  for(let i=0;i<n;i++){ const p=P[i], a=P[(i+n-1)%n], b=P[(i+1)%n];
    const ua=[a[0]-p[0],a[1]-p[1]], ub=[b[0]-p[0],b[1]-p[1]]; const la=Math.hypot(...ua), lb=Math.hypot(...ub);
    const u=[ua[0]/la,ua[1]/la], v=[ub[0]/lb,ub[1]/lb]; const th=Math.acos(Math.max(-1,Math.min(1,u[0]*v[0]+u[1]*v[1])));
    const t=r/Math.tan(th/2); const A=[p[0]+u[0]*t,p[1]+u[1]*t], B=[p[0]+v[0]*t,p[1]+v[1]*t];
    const bs=[u[0]+v[0],u[1]+v[1]], bl=Math.hypot(...bs); const C=[p[0]+bs[0]/bl*r/Math.sin(th/2), p[1]+bs[1]/bl*r/Math.sin(th/2)];
    let a0=Math.atan2(A[1]-C[1],A[0]-C[0]), a1=Math.atan2(B[1]-C[1],B[0]-C[0]); let d=a1-a0; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    for(let k=0;k<=seg;k++){ const an=a0+d*k/seg; out.push([C[0]+r*Math.cos(an), C[1]+r*Math.sin(an)]); } }
  return out; }
const rrect = (w,h,r) => fillet([[w/2,h/2],[-w/2,h/2],[-w/2,-h/2],[w/2,-h/2]], r, 6);

/* ---------- KHUNG ---------- */
const FRAME = ['side','crossBottom','crossFR','crossTop','rails','midRails','tray','posts','bezels','rearPosts','eyes'];
begin('side'); for(const z of [HZ,-HZ]) tube(fillet([[HX,Y0],[HX,YF],[-HX,YR],[-HX,Y0]],FR).map(([x,y])=>[x,y,z]), true);
begin('crossBottom'); for(const x of [34,-34]) line([x,Y0,-HZ],[x,Y0,HZ]);
begin('crossFR'); for(const y of [24,63]) line([HX,y,-HZ],[HX,y,HZ]); for(const y of [24,49]) line([-HX,y,-HZ],[-HX,y,HZ]);
const TOPF=[HX-20*CS, YF-20*SN], TOPR=[-HX+20*CS, YR+20*SN];
begin('crossTop'); for(const p of [TOPF,TOPR]) line([p[0],p[1],-HZ],[p[0],p[1],HZ]);
begin('rails'); for(const z of [15,-15]) line(roofW(-39,1.6,z), roofW(31,1.6,z));
begin('midRails'); for(const z of [HZ,-HZ]) line([-HX,42,z],[HX,42,z]);
begin('tray'); for(const z of [-22,0,22]) line([-40,Y0+1.6,z],[40,Y0+1.6,z]);
begin('posts'); for(const z of [HZ,-HZ]){ for(const x of [15,29,-36]) line([x,Y0,z],[x,42,z]); }
begin('bezels'); tube(rrect(62,39,3).map(([z,y])=>[HX+0.4,y+61.5,z]), true);
begin('rearPosts'); for(const z of [20,-20]) line([-HX,24,z],[-HX,49,z]);
begin('eyes'); for(const s of [1,-1]){ for(const [x,y] of [[-36,22.8],[-16,9.8],[2,9.8]]){ const t=new THREE.Mesh(new THREE.TorusGeometry(1.9,0.8,8,20),mat.brass); t.position.set(x,y,s*(HZ+1.6)); add(t); } }

/* các đoạn đồng đã cắt, xếp trên bàn (chỉ hiện ở bước a1) */
begin('cut'); { let z=70; for(const c of CUTS){ if(c.name.startsWith('Kẹp')) continue; for(let i=0;i<c.n;i++){ line([-c.L/2,0.8,z],[c.L/2,0.8,z]); z+=4.2; } z+=3; } }

/* ---------- MODULE TRONG THÂN ---------- */
begin('holders'); for(const z of [11,-11]){ box(76,1.6,21,mat.holder,-10,Y0+2.4,z); box(3,14,21,mat.holder,-46.5,Y0+9,z); box(3,14,21,mat.holder,26.5,Y0+9,z); }
begin('cells'); for(const z of [11,-11]){ cyl(9.2,65,mat.batt,-10,Y0+12.4,z,'x',32); cyl(9.3,3,mat.silver,22.5,Y0+12.4,z,'x'); }
begin('charger'); box(1.6,17,22,mat.pcbRed,-48.6,33,-6); box(4,3.4,9,mat.silver,-51,27,-6);
begin('switch'); box(5,9,13,mat.pcbBlack,-50.5,43,9); box(3,3,4,mat.silver,-53.5,43,10);
begin('bus'); box(22,14,1.6,mat.perf,-37,32,-30.4); box(20,2,0.6,basic(WC.red),-37,36,-29.4); box(20,2,0.6,basic(WC.black),-37,28,-29.4);
begin('motors'); for(const s of [1,-1]){ box(12,10,15,mat.motor,22,36.8,s*15); box(12,10,9,mat.gearbox,22,36.8,s*27); box(3,4,1.2,mat.brass,22,36.8,s*7); }
begin('mx'); box(24,21,1.6,mat.pcbBlue,-8,46,-30.4); cyl(4,12,mat.cap,-17,60,-27);
begin('amp'); box(18,18,1.6,mat.pcbPurple,0,22,30.4); cyl(4,12,mat.cap,10,30,27);
begin('speaker'); { const o=cyl(10,6,mat.pcbBlack,-17,46,28,'z',40); o.scale.x=1.5; }
begin('tof'); box(2,13,25,mat.pcbBlack,50.4,15,0); for(const z of [-5,5]) cyl(1.8,1,mat.silver,51.6,15,z,'x');
begin('sht'); box(2,10,13,mat.pcbPurple,52.2,15.5,-21); cyl(2.6,0.6,mat.silver,53.4,17,-23,'x'); box(1,2.4,2.4,mat.pcbBlack,53.4,13.5,-19);
{ begin('tftmouth'); const wp=[]; for(let i=0;i<=60;i++){ const z=-10+20*i/60; wp.push(new THREE.Vector3(50.45, 52+Math.sin(i*0.9)*Math.sin(i*0.17)*2.2, z)); } cur.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(wp), new THREE.LineBasicMaterial({color:0x38e1ff}))); }
begin('tft'); box(3,35,57,mat.pcbBlue,48.3,61.5,0); box(0.6,28,36,mat.pcbBlack,49.9,61.5,0);
  for(const z of [-9,9]){ const e=new THREE.Mesh(new THREE.CircleGeometry(6,40),basic(0x38e1ff)); e.position.set(50.3,63,z); e.rotation.y=Math.PI/2; cur.add(e);
    const h=new THREE.Mesh(new THREE.CircleGeometry(1.8,20),basic(0xffffff)); h.position.set(50.4,65.5,z+2.5); h.rotation.y=Math.PI/2; cur.add(h); }

/* ---------- NÓC (toạ độ theo mặt dốc) ---------- */
begin('perf', roofG); box(72,1.6,30,mat.perf,13,3.2,0); for(const z of [11.5,-11.5]) box(56,8.5,2.5,mat.pcbBlack,13,8.25,z);
begin('devkit', roofG); box(69,1.6,26,mat.pcbBlack,13,13.3,0); box(18,3.2,16,mat.silver,30,15.7,0); for(const z of [6,-6]) box(7,3.2,9,mat.silver,-19.5,15.7,z);
begin('camera', roofG); box(8.5,8.5,5,mat.pcbBlack,50.5,7.5,0); cyl(3,4,mat.pcbBlack,55,7.5,0,'x'); cyl(1.8,0.5,M({color:0x2050a0,metalness:.5,roughness:.1}),57.2,7.5,0,'x');
  { const f=box(9,0.3,9,mat.fpc,46.5,11,0); f.rotation.z=-0.5; }
const sub = (x,z) => box(17,1.2,18,mat.perf,x,1.8,z);
begin('irtx', roofG); sub(38,-23.5); box(14,1.4,12,mat.pcbBlue,38,3.1,-23); cyl(2.5,6,mat.led,44.5,5.5,-23,'x');
begin('mic', roofG); sub(38,23.5); cyl(7,1.4,mat.pcbBlack,38,3.1,23,'y',40); cyl(2,1.2,mat.silver,38,4.4,23);

    ${s.pins?`<div class="blk"><h3>Nối dây (thử trên breadboard)</h3>${pinTable(pinsOf(...s.pins), s.pins.length>1)}</div>`:''}
    ${checks?`<div class="blk"><h3>Kiểm tra</h3><ul class="checks">${checks}</ul></div>`:''}
    ${s.tip?`<div class="blk tip${s.tip.warn?' warn':''}"><b>${esc(s.tip.t)}.</b> ${esc(s.tip.b)}</div>`:''}`;
  $('#prevBtn').disabled = cur_i===0; $('#nextBtn').disabled = cur_i===STEPS.length-1;
  $('#nextBtn').textContent = cur_i===STEPS.length-1 ? 'Xong' : 'Bước tiếp →';
}
function stepDone(s){ return (s.check||[]).length>0 && s.check.every((_,k)=>done[s.id+':'+k]); }
function go(i, push=true){ cur_i=Math.max(0,Math.min(STEPS.length-1,i)); STEPS.forEach(s=>{ done[s.id]=stepDone(s); });
  renderPhases(); renderStep(); applyStep(cur_i); $('#scroll').scrollTop=0;
  if(push && location.hash!=='#'+STEPS[cur_i].id) history.replaceState(null,'','#'+STEPS[cur_i].id); }

$('#phases').addEventListener('click',e=>{ const b=e.target.closest('[data-ph]'); if(b) go(IDX[STEPS.find(s=>s.ph===b.dataset.ph).id]); });
$('#dots').addEventListener('click',e=>{ const b=e.target.closest('[data-i]'); if(b) go(+b.dataset.i); });
$('#step').addEventListener('change',e=>{ const k=e.target.dataset.key; if(!k) return; done[k]=e.target.checked; const s=STEPS[cur_i]; done[s.id]=stepDone(s); saveDone(); renderPhases(); });
$('#prevBtn').onclick=()=>go(cur_i-1); $('#nextBtn').onclick=()=>go(cur_i+1);
addEventListener('keydown',e=>{ if(e.target.closest('input,textarea')) return; if(e.key==='ArrowRight') go(cur_i+1); if(e.key==='ArrowLeft') go(cur_i-1); });
addEventListener('hashchange',()=>{ const i=IDX[location.hash.slice(1)]; if(i!==undefined && i!==cur_i) go(i,false); });
$('#ghostBtn').onclick=e=>{ ghost=!ghost; e.currentTarget.setAttribute('aria-pressed',ghost); applyStep(cur_i); };
$('#labelBtn').onclick=e=>{ showLabels=!showLabels; e.currentTarget.setAttribute('aria-pressed',showLabels); };
$('#resetBtn').onclick=()=>goCam(STEPS[cur_i].cam);
