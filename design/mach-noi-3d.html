<title>Mạch nối QBK-Robo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed 3D bench, floating title + toolbar; legend docked bottom */
:root{--bg:#e6eaed;--panel:#ffffff;--ink:#17202a;--muted:#56626d;--line:#cfd6dc;--brass:#99681a;
 --f-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;--f-body:"Be Vietnam Pro",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10151a;--panel:#18212a;--ink:#e6e9ec;--muted:#9aa6b1;--line:#2a343e;--brass:#e0aa4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151a;--panel:#18212a;--ink:#e6e9ec;--muted:#9aa6b1;--line:#2a343e;--brass:#e0aa4a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;pointer-events:none}
.top h1{margin:0;font:700 26px var(--f-display);letter-spacing:.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;align-items:flex-start}
.tools button{font:500 13px var(--f-body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.tools button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.tools button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.legend{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:20px;height:7px;border-radius:4px;margin-right:6px;vertical-align:1px;border:1px solid rgba(127,127,127,.5)}
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-120%);font:600 12px var(--f-body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--brass);padding:3px 8px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (max-width:600px){.top h1{font-size:20px}.top p{display:none}.legend{font-size:11px}}
</style>
<div id="stage"></div><div id="tags"></div><div class="loading" id="loading">Đang dựng mô hình…</div>
<div class="top"><div><h1>QBK-Robo · Mạch nối 3D</h1><p>Mạch vẽ theo hình thật, chữ chân in trên mạch. Dây hàn vào mặt dưới lỗ chân. Chân GPIO là bản tạm, chờ sơ đồ của shop.</p></div>
<div class="tools"><button id="bFrame" aria-pressed="true">Khung đồng</button><button id="bTrack" aria-pressed="false">Bánh xích</button><button id="bTags" aria-pressed="true">Tên module</button><button id="bView">Đổi góc</button></div></div>
<div class="legend" id="legend"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
await Promise.race([Promise.all(['700 12px "JetBrains Mono"','700 12px "Be Vietnam Pro"','800 12px "Be Vietnam Pro"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
const WC = { red:0xd83a2e, orange:0xf08a24, black:0x202020, yellow:0xf2c81e, green:0x2fa84f, purple:0x8a4fd0, blue:0x2f6fdc, brown:0x7a4a26, white:0xf0f0f0, grey:0x8a8f96 };
const HX=50, HZ=32, Y0=8, YF=82, YR=62, FR=14.3, R=0.8;
const yTop = x => YR + (x+HX)/(2*HX)*(YF-YR);
const SL = Math.atan2(YF-YR, 2*HX), CS=Math.cos(SL), SN=Math.sin(SL), RY0=yTop(0);
const roofW = (lx,ly,lz) => [lx*CS - ly*SN, RY0 + lx*SN + ly*CS, lz];

const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stageEl.prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const M = (o) => new THREE.MeshStandardMaterial(o);
const mat = {
  brass: M({color:0xd9a441, metalness:1, roughness:0.3}),
  brassDark: M({color:0xb07a2a, metalness:1, roughness:0.38}),
  rubber: M({color:0x2a2b2f, roughness:0.85}),
  plastic: M({color:0xd8dadc, roughness:0.45, metalness:0.05}),
  darkPlastic: M({color:0x3a3d42, roughness:0.6}),
  pcbBlue: M({color:0x1d3f8a, roughness:0.6}), pcbBlack: M({color:0x141518, roughness:0.5}),
  pcbRed: M({color:0xb3262b, roughness:0.55}), pcbPurple: M({color:0x5e3a9a, roughness:0.6}),
  perf: M({color:0xc9a26a, roughness:0.7}), silver: M({color:0xc8ccd2, metalness:1, roughness:0.3}),
  batt: M({color:0x2a8a4a, roughness:0.4, metalness:0.2}), holder: M({color:0x18191b, roughness:0.7}),
  cap: M({color:0x1d2a5a, roughness:0.4}), motor: M({color:0xd8d8d8, metalness:0.9, roughness:0.35}),
  gearbox: M({color:0xc9a040, metalness:0.8, roughness:0.4}), fpc: M({color:0xd08a2a, roughness:0.5}),
  glass: new THREE.MeshPhysicalMaterial({color:0xfff2d8, roughness:0.05, transmission:0.85, transparent:true, opacity:0.4}),
  led: M({color:0xaaccff, transparent:true, opacity:0.8, roughness:0.2}),
  white: M({color:0xf2f2f2, roughness:0.5}),
};
const basic = c => new THREE.MeshBasicMaterial({color:c});

const world = new THREE.Group(); scene.add(world);
const roofG = new THREE.Group(); roofG.position.set(0, RY0, 0); roofG.rotation.z = SL; world.add(roofG);
const parts = {}; let cur = null;
function begin(id, parent=world){ const g = new THREE.Group(); g.name=id; parent.add(g); parts[id]=g; cur=g; return g; }
function add(m){ m.castShadow = true; m.receiveShadow = true; cur.add(m); return m; }
function box(w,h,d,m,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); return add(o); }
function cyl(r,h,m,x,y,z,axis='y',seg=28){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m); o.position.set(x,y,z); if(axis==='x')o.rotation.z=Math.PI/2; if(axis==='z')o.rotation.x=Math.PI/2; return add(o); }
function line(a,b,m=mat.brass,r=R){ const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,A.distanceTo(B),12),m);
  o.position.copy(A).add(B).multiplyScalar(.5); o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize()); return add(o); }
function densify(pts, step=3){ const out=[]; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; out.push(a);
  const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]); const n=Math.floor(d/step); for(let k=1;k<n;k++){ const t=k/n; out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]); } } return out; }
function tube(pts, closed, m=mat.brass, r=R, dense=true){ const p = dense ? densify(pts) : pts;
  const curve = new THREE.CatmullRomCurve3(p.map(q=>new THREE.Vector3(...q)), closed, 'centripetal');
  return add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(40, p.length*3), r, 10, closed), m)); }
function fillet(P, r, seg=10){ const out=[], n=P.length;
  for(let i=0;i<n;i++){ const p=P[i], a=P[(i+n-1)%n], b=P[(i+1)%n];
    const ua=[a[0]-p[0],a[1]-p[1]], ub=[b[0]-p[0],b[1]-p[1]]; const la=Math.hypot(...ua), lb=Math.hypot(...ub);
    const u=[ua[0]/la,ua[1]/la], v=[ub[0]/lb,ub[1]/lb]; const th=Math.acos(Math.max(-1,Math.min(1,u[0]*v[0]+u[1]*v[1])));
    const t=r/Math.tan(th/2); const A=[p[0]+u[0]*t,p[1]+u[1]*t], B=[p[0]+v[0]*t,p[1]+v[1]*t];
    const bs=[u[0]+v[0],u[1]+v[1]], bl=Math.hypot(...bs); const C=[p[0]+bs[0]/bl*r/Math.sin(th/2), p[1]+bs[1]/bl*r/Math.sin(th/2)];
    let a0=Math.atan2(A[1]-C[1],A[0]-C[0]), a1=Math.atan2(B[1]-C[1],B[0]-C[0]); let d=a1-a0; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    for(let k=0;k<=seg;k++){ const an=a0+d*k/seg; out.push([C[0]+r*Math.cos(an), C[1]+r*Math.sin(an)]); } }
  return out; }
const rrect = (w,h,r) => fillet([[w/2,h/2],[-w/2,h/2],[-w/2,-h/2],[w/2,-h/2]], r, 6);

/* ---------- KHUNG ---------- */
const FRAME = ['side','crossBottom','crossFR','crossTop','rails','midRails','tray','posts','bezels','rearPosts','eyes'];
begin('side'); for(const z of [HZ,-HZ]) tube(fillet([[HX,Y0],[HX,YF],[-HX,YR],[-HX,Y0]],FR).map(([x,y])=>[x,y,z]), true);
begin('crossBottom'); for(const x of [34,-34]) line([x,Y0,-HZ],[x,Y0,HZ]);
begin('crossFR'); for(const y of [24,63]) line([HX,y,-HZ],[HX,y,HZ]); for(const y of [24,49]) line([-HX,y,-HZ],[-HX,y,HZ]);
const TOPF=[HX-20*CS, YF-20*SN], TOPR=[-HX+20*CS, YR+20*SN];
begin('crossTop'); for(const p of [TOPF,TOPR]) line([p[0],p[1],-HZ],[p[0],p[1],HZ]);
begin('rails'); for(const z of [15,-15]) line(roofW(-39,1.6,z), roofW(31,1.6,z));
begin('midRails'); for(const z of [HZ,-HZ]) line([-HX,42,z],[HX,42,z]);
begin('tray'); for(const z of [-22,0,22]) line([-40,Y0+1.6,z],[40,Y0+1.6,z]);
begin('posts'); for(const z of [HZ,-HZ]){ for(const x of [15,29,-36]) line([x,Y0,z],[x,42,z]); }
begin('bezels'); tube(rrect(62,39,3).map(([z,y])=>[HX+0.4,y+61.5,z]), true);
begin('rearPosts'); for(const z of [20,-20]) line([-HX,24,z],[-HX,49,z]);
begin('eyes'); for(const s of [1,-1]){ for(const [x,y] of [[-36,22.8],[-16,9.8],[2,9.8]]){ const t=new THREE.Mesh(new THREE.TorusGeometry(1.9,0.8,8,20),mat.brass); t.position.set(x,y,s*(HZ+1.6)); add(t); } }




/* ---------- BÁNH XÍCH ---------- */
const TZ=HZ+8, TW=12, S1={x:22,y:36.8,r:33}, S2={x:-36,y:22.8,r:19}, RW=[-16,2], RWY=9.8;
function trackPath(C1,C2,T=2.5){ const r1=C1.r+T, r2=C2.r+T, dx=C2.x-C1.x, dy=C2.y-C1.y, d=Math.hypot(dx,dy);
  const th=Math.atan2(dy,dx), al=Math.acos((r1-r2)/d), up=th+al, lo=th-al, N=160, pts=[];
  const P=(c,r,a)=>[c.x+r*Math.cos(a), c.y+r*Math.sin(a)];
  const A=P(C1,r1,up), B=P(C2,r2,up); for(let i=0;i<N;i++){const t=i/N; pts.push([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t]);}
  for(let i=0;i<N;i++) pts.push(P(C2,r2,up-(up-lo)*i/N));
  const C=P(C2,r2,lo), D=P(C1,r1,lo); for(let i=0;i<N;i++){const t=i/N; pts.push([C[0]+(D[0]-C[0])*t, C[1]+(D[1]-C[1])*t]);}
  const end=up-2*Math.PI; for(let i=0;i<N;i++) pts.push(P(C1,r1,lo-(lo-end)*i/N));
  return pts; }
function gear(cx,cy,z,r,teeth,th,m){ const g=new THREE.Group(); g.position.set(cx,cy,z); cur.add(g);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r-3,2.2,12,64),m); g.add(ring);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(5,5,th+2,24),m); hub.rotation.x=Math.PI/2; g.add(hub);
  for(let i=0;i<6;i++){ const a=i*Math.PI/3, sp=new THREE.Mesh(new THREE.BoxGeometry(r-6,3,th*0.7),m); sp.position.set(Math.cos(a)*(r-6)/2,Math.sin(a)*(r-6)/2,0); sp.rotation.z=a; g.add(sp); }
  for(let i=0;i<teeth;i++){ const a=i*2*Math.PI/teeth, t=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.6,th),m); t.position.set(Math.cos(a)*(r-0.4),Math.sin(a)*(r-0.4),0); t.rotation.z=a; g.add(t); }
  g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; } }); }
begin('drive'); for(const s of [1,-1]){ gear(S1.x,S1.y,s*TZ,S1.r,64,4,mat.plastic); line([S1.x,S1.y,s*(HZ-1)],[S1.x,S1.y,s*(TZ+2)],mat.silver,1.5); }
begin('idler'); for(const s of [1,-1]){ gear(S2.x,S2.y,s*TZ,S2.r,30,4,mat.darkPlastic); line([S2.x,S2.y,s*HZ],[S2.x,S2.y,s*(TZ+4)],mat.silver,1.5); }
begin('road'); for(const s of [1,-1]){ for(const x of RW){ cyl(6,10,mat.darkPlastic,x,RWY,s*TZ,'z'); line([x,RWY,s*HZ],[x,RWY,s*(TZ+6)],mat.silver,1.2); } }
begin('track'); for(const s of [1,-1]){ const p=trackPath(S2,S1); let acc=0; const seg=[0];
  for(let i=1;i<p.length;i++){ acc+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); seg.push(acc); }
  let j=0; const padG=new THREE.BoxGeometry(4.4,2.6,TW), gripG=new THREE.BoxGeometry(1.4,1.6,TW*0.9);
  for(let L=0; L<acc; L+=5.2){ while(seg[j+1]<L && j<p.length-2) j++;
    const a=p[j], b=p[(j+1)%p.length], ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    const pad=new THREE.Mesh(padG,mat.rubber); pad.position.set(a[0],a[1],s*TZ); pad.rotation.z=ang; add(pad);
    const gr=new THREE.Mesh(gripG,mat.rubber); gr.position.set(a[0]+Math.sin(ang)*1.9, a[1]-Math.cos(ang)*1.9, s*TZ); gr.rotation.z=ang; cur.add(gr); } }


/* =====================================================================
   MODULE THẬT: mạch in có chữ chân, lỗ hàn, chip; dây hàn vào đúng lỗ
   ===================================================================== */
const PX = 18; // pixel / mm cho texture
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
function circ(ctx,x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function rrectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function texFrom(c){ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function canvasFor(w,d){ const c=document.createElement('canvas'); c.width=Math.round(w*PX); c.height=Math.round(d*PX); return c; }
const MONO='"JetBrains Mono",ui-monospace,Menlo,monospace', SANS='"Be Vietnam Pro",Arial,sans-serif';

/* def: {w,d,t,color,silk,pads:[[name,x,z,{text,align,off,fs,col}]],holes,draw(ctx,P,mm),extra(g,top)} */
function pcb(def){
  const g=new THREE.Group(); const c=canvasFor(def.w,def.d), x=c.getContext('2d');
  const P=(mx,mz)=>[(mx+def.w/2)*PX,(mz+def.d/2)*PX]; const mm=v=>v*PX;
  x.fillStyle=def.color; x.fillRect(0,0,c.width,c.height);
  if(def.perf){ x.fillStyle='rgba(0,0,0,.28)'; for(let i=1.27;i<def.w;i+=2.54) for(let j=1.27;j<def.d;j+=2.54){ circ(x,mm(i),mm(j),mm(0.42)); } x.fillStyle='rgba(205,160,70,.55)'; for(let i=1.27;i<def.w;i+=2.54) for(let j=1.27;j<def.d;j+=2.54){ x.beginPath(); x.arc(mm(i),mm(j),mm(0.75),0,Math.PI*2); x.lineWidth=mm(0.25); x.strokeStyle='rgba(190,140,60,.6)'; x.stroke(); } }
  (def.holes||[]).forEach(([hx,hz,r])=>{ const [px,py]=P(hx,hz); x.fillStyle='#e2c36a'; circ(x,px,py,mm(r+0.55)); x.fillStyle='#1a1a1a'; circ(x,px,py,mm(r)); });
  def.draw && def.draw(x,P,mm);
  for(const [name,px0,pz0,o={}] of def.pads){ const [cx,cy]=P(px0,pz0);
    x.fillStyle='#e9c35c'; circ(x,cx,cy,mm(0.95)); x.fillStyle='#3b3020'; circ(x,cx,cy,mm(0.45));
    if(o.text!==''){ x.fillStyle=o.col||def.silk||'#f4f4f4'; x.font=`700 ${mm(o.fs||1.25)}px ${MONO}`; x.textBaseline='middle'; x.textAlign=o.align||'left';
      const off=o.off||[1.45,0]; x.fillText(o.text||name, cx+mm(off[0]), cy+mm(off[1])); } }
  const top=new THREE.MeshStandardMaterial({map:texFrom(c), roughness:.5, metalness:.05});
  const side=new THREE.MeshStandardMaterial({color:def.edge||def.color, roughness:.65});
  const m=new THREE.Mesh(new THREE.BoxGeometry(def.w,def.t,def.d),[side,side,top,side,side,side]); m.castShadow=m.receiveShadow=true; g.add(m);
  def.extra && def.extra(g, def.t/2);
  g.userData.def=def; return g;
}
const BASIS={ up:[[1,0,0],[0,1,0],[0,0,1]], roof:[[0,0,-1],[0,1,0],[1,0,0]], front:[[0,0,-1],[1,0,0],[0,-1,0]],
  left:[[-1,0,0],[0,0,-1],[0,-1,0]], right:[[1,0,0],[0,0,1],[0,-1,0]], back:[[0,0,1],[-1,0,0],[0,-1,0]] };
function place(g,parent,pos,face){ const b=BASIS[face]; g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V3(...b[0]),V3(...b[1]),V3(...b[2]))); g.position.set(...pos); parent.add(g); return g; }
function addTo(g, mesh){ mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh); return mesh; }
function gbox(g,w,h,d,m,x,y,z){ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); return addTo(g,o); }
function gcyl(g,r,h,m,x,y,z,axis='y',seg=28){ const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m); o.position.set(x,y,z); if(axis==='x')o.rotation.z=Math.PI/2; if(axis==='z')o.rotation.x=Math.PI/2; return addTo(g,o); }
function labelTex(w,d,bg,draw){ const c=canvasFor(w,d), x=c.getContext('2d'); x.fillStyle=bg; x.fillRect(0,0,c.width,c.height); draw(x,v=>v*PX); return new THREE.MeshStandardMaterial({map:texFrom(c), roughness:.45}); }
function topTexBox(g,w,h,d,bg,draw,x,y,z,sideCol,metal=0){ const top=labelTex(w,d,bg,draw); top.metalness=metal; const s=new THREE.MeshStandardMaterial({color:sideCol||bg, roughness:.5, metalness:metal});
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[s,s,top,s,s,s]); o.position.set(x,y,z); return addTo(g,o); }

  for(const e of [-42.5,22.5]){ const cp=new THREE.Mesh(new THREE.CircleGeometry(9.2,32),mat.silver); cp.position.set(e,Y0+12.4,z); cp.rotation.y=e<0?-Math.PI/2:Math.PI/2; g.add(cp); }
  gbox(g,1,4,4,M({color:0xd9b45a,metalness:.8}),-44.6,Y0+16,z); }

/* ---------- Motor N20 ---------- */
for(const s of [1,-1]){ const g=new THREE.Group(); world.add(g); gbox(g,12,10,15,mat.motor,22,36.8,s*15); gbox(g,12,10,9,mat.gearbox,22,36.8,s*27);
  for(const dy of [2.2,-2.2]) gbox(g,1.5,1.4,1.2,M({color:0xd9b45a,metalness:.8}),22,36.8+dy,s*7); }
const motW=(s,dy)=>[V3(22,36.8+dy,s*6.6), V3(22,36.8+dy,s*3.5)];

/* =====================================================================
   DÂY: hàn vào mặt dưới lỗ chân, đi theo các bó
   ===================================================================== */
scene.updateMatrixWorld(true);
const wireMat={}; const wmat=c=>wireMat[c]||(wireMat[c]=M({color:WC[c], roughness:.5}));
const solderMat=M({color:0xc9ccd0, metalness:.9, roughness:.25});
const WIRES=[];
function wire(a,b,color,via=[],r=0.5){ // a,b = [pos, lead]
  const pts=[a[0],a[1],...via.map(v=>v.isVector3?v:V3(...v)),b[1],b[0]];
  const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
  const m=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(48,pts.length*16),r,8,false),wmat(color)); m.castShadow=true; world.add(m); WIRES.push(m);
  for(const e of [a[0],b[0]]){ const s=new THREE.Mesh(new THREE.SphereGeometry(r*1.5,10,8),solderMat); s.position.copy(e); world.add(s); }
}
function bundle(list, via, axis=[0,0,1], gap=1.15){ const n=list.length; list.forEach((w,i)=>{ const o=(i-(n-1)/2)*gap; wire(w[0],w[1],w[2], via.map(v=>{ const p=v.isVector3?v.clone():V3(...v); return p.add(V3(axis[0]*o,axis[1]*o,axis[2]*o)); }), w[3]); }); }
const RWV = (x,y,z)=>V3(...roofW(x,y,z));

// Màn TFT
bundle([[padW('tft','LED'),espW('J1','3V3',0),'orange'],[padW('tft','SCK'),espW('J3','21'),'purple'],[padW('tft','SDA'),espW('J3','47'),'purple'],
  [padW('tft','A0'),espW('J1','14'),'purple'],[padW('tft','RESET'),espW('J1','RST'),'white'],[padW('tft','CS'),espW('J1','G'),'black'],
  [padW('tft','GND'),espW('J3','G',0),'black'],[padW('tft','VCC'),espW('J1','3V3',1),'orange']],
  [RWV(20,-4,4),RWV(36,-6,12),V3(43,69,22),V3(44.5,64,25.5)],[0,-1,0],1.25);
// I2C: ESP → TOF050C → SHT31
bundle([[padW('tof','VIN'),espW('J1','3V3',1),'orange'],[padW('tof','GND'),espW('J3','G',1),'black'],[padW('tof','SCL'),espW('J3','39'),'green'],[padW('tof','SDA'),espW('J3','38'),'yellow']],
  [RWV(16,-4,-4),RWV(36,-6,-10),V3(43,66,-14),V3(45.5,42,-13),V3(47,24,-6)],[0,0,1],1.2);
bundle([[padW('sht','VIN'),padW('tof','VIN',-1,2),'orange'],[padW('sht','GND'),padW('tof','GND',-1,2),'black'],[padW('sht','SCL'),padW('tof','SCL',-1,2),'green'],[padW('sht','SDA'),padW('tof','SDA',-1,2),'yellow']],
  [V3(47.6,21.5,-8),V3(48.2,20.5,-14)],[0,-1,0],1.0);
// Motor: ESP → MX1508
bundle([[padW('mx','IN1'),espW('J3','45'),'brown'],[padW('mx','IN2'),espW('J1','46'),'brown'],[padW('mx','IN3'),espW('J3','48'),'brown'],[padW('mx','IN4'),espW('J3','20'),'brown']],
  [RWV(2,-5,-3),V3(-2,64,-17),V3(-12,57,-27)],[0,-1,0],1.2);
bundle([[padW('mx','+'),padW('bus','MX5V'),'red',0.7],[padW('mx','−'),padW('bus','MXGND'),'black',0.7]],[V3(-24,44,-27.5)],[0,1,0],1.6);
bundle([[padW('mx','MA1'),motW(-1,2.2),'grey'],[padW('mx','MA2'),motW(-1,-2.2),'grey']],[V3(6,38,-26),V3(16,38,-14)],[0,1,0],1.2);
bundle([[padW('mx','MB1'),motW(1,2.2),'grey'],[padW('mx','MB2'),motW(1,-2.2),'grey']],[V3(6,52,-26),V3(12,30,-4),V3(18,34,3)],[0,1,0],1.2);
// I2S: mic, ampli
bundle([[padW('mic','SCK'),espW('J3','2'),'blue'],[padW('mic','WS'),espW('J3','42'),'blue'],[padW('mic','L/R'),espW('J1','G'),'black'],
  [padW('mic','SD'),espW('J3','41'),'blue'],[padW('mic','VDD'),espW('J1','3V3',0),'orange'],[padW('mic','GND'),espW('J3','G',2),'black']],
  [RWV(36,-3,24),RWV(30,-4,17)],[1,0,0],1.15);
bundle([[padW('amp','LRC'),espW('J3','42'),'blue'],[padW('amp','BCLK'),espW('J3','2'),'blue'],[padW('amp','DIN'),espW('J3','40'),'blue']],
  [V3(8,34,28.6),V3(7,52,24),V3(5,64,14),RWV(6,-5,6)],[1,0,0],1.2);
bundle([[padW('amp','Vin'),padW('bus','AMP5V'),'red',0.7],[padW('amp','GND'),padW('bus','AMPGND'),'black',0.7]],
  [V3(-41,42,-26),V3(-44,47,0),V3(-30,38,27),V3(-4,20,28.6)],[0,1,0],1.6);
bundle([[padW('amp','SPK+',1,4),[V3(-12,46,25.4),V3(-12,46,23.5)],'grey'],[padW('amp','SPK-',1,4),[V3(-22,46,25.4),V3(-22,46,23.5)],'grey']],[V3(-6,30,33),V3(-12,40,27)],[1,0,0],1.4);
// IR, nút chạm
bundle([[padW('irtx','SIG'),espW('J3','19'),'white'],[padW('irtx','VCC'),espW('J1','5V'),'red'],[padW('irtx','GND'),espW('J3','G',2),'black']],[RWV(30,-3,-18)],[1,0,0],1.2);
bundle([[padW('irrx','OUT'),espW('J3','0'),'white'],[padW('irrx','VCC'),espW('J1','3V3',1),'orange'],[padW('irrx','GND'),espW('J1','G'),'black']],[RWV(-6,-3,-17)],[1,0,0],1.2);
bundle([[padW('touch','I/O'),espW('J1','3'),'white'],[padW('touch','VCC'),espW('J1','3V3',0),'orange'],[padW('touch','GND'),espW('J1','G'),'black']],[RWV(-6,-3,18)],[1,0,0],1.2);
// Đèn Edison (qua trở trên đế nóc)
for(const x of [-28,-36]){ wire([RWV(x,2.4,15),RWV(x,-1,15)],espW('J1','5V'),'red',[RWV(-20,-3,11)]); wire([RWV(x,2.4,-15),RWV(x,-1,-15)],espW('J3','G',1),'black',[RWV(-20,-3,-11)]); }
// Nguồn
for(const z of [11,-11]){ wire([V3(-44.4,Y0+16,z),V3(-43,Y0+19,z)],padW('chg','B+'),'red',[V3(-44,30,z*0.6-6)],0.7); wire([V3(-44.4,Y0+13.5,z),V3(-42.5,Y0+15,z)],padW('chg','B-'),'black',[V3(-43.5,27,z*0.6-8)],0.7); }
wire(padW('chg','OUT+'),swW(0),'red',[V3(-46,42,4)],0.7);
wire(swW(2.54),padW('bus','IN5V'),'red',[V3(-46,48,-6),V3(-40,44,-24)],0.7);
wire(padW('chg','OUT-'),padW('bus','INGND'),'black',[V3(-44,30,-20)],0.7);
wire([V3(-44.4,Y0+17,-11),V3(-42,Y0+19,-12)],padW('bus','BAT'),'red',[V3(-40,30,-24)]);
bundle([[padW('bus','UP5V'),espW('J1','5V'),'red',0.7],[padW('bus','UPGND'),espW('J1','G'),'black',0.7],[padW('bus','MID'),espW('J3','1'),'white']],
  [V3(-36,44,-27),V3(-38,54,-22),V3(-30,62,-12),RWV(-17,-4,-5)],[0,0,1],1.5);

/* =====================================================================
   SÂN KHẤU
   ===================================================================== */
stageEl.appendChild(renderer.domElement);
const frameIds=['side','crossBottom','crossFR','crossTop','rails','midRails','tray','posts','bezels','rearPosts','eyes'];
const frameMat=mat.brass.clone(); frameMat.transparent=true; frameMat.opacity=0.6;
for(const id of frameIds) parts[id].traverse(o=>{ if(o.isMesh){ o.material=frameMat; o.castShadow=false; } });
const trackIds=['track','road','idler','drive'];
const setVis=(ids,v)=>ids.forEach(id=>parts[id].visible=v);
setVis(trackIds,false);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshStandardMaterial({color:0xd0d7dc,roughness:.95}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.6; ground.receiveShadow=true; scene.add(ground);
scene.add(new THREE.HemisphereLight(0xffffff,0x40382f,0.7));
const sun=new THREE.DirectionalLight(0xffffff,1.7); sun.position.set(140,260,170); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-180,right:180,top:180,bottom:-180,near:10,far:700}); scene.add(sun);
const f1=new THREE.DirectionalLight(0xc8d6ff,0.8); f1.position.set(-160,120,-140); scene.add(f1);
const f2=new THREE.DirectionalLight(0xffffff,0.55); f2.position.set(-100,140,200); scene.add(f2);
function theme(){ const cs=getComputedStyle(document.documentElement); scene.background=new THREE.Color(cs.getPropertyValue('--bg').trim()||'#e6eaed');
  ground.material.color.set(matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light' || document.documentElement.dataset.theme==='dark' ? '#1a2128' : '#d0d7dc'); }
theme(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const cam=new THREE.PerspectiveCamera(30,1,1,4000);
const controls=new OrbitControls(cam,renderer.domElement); controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.495;
const VIEWS=[ [[150,120,-175],[4,44,-4]], [[-160,130,175],[-4,44,4]], [[250,105,25],[25,45,0]], [[60,290,60],[6,60,0]], [[40,110,-270],[0,40,-10]], [[20,110,270],[0,40,10]] ];
let vi=0; const goView=i=>{ const [p,t]=VIEWS[i%VIEWS.length]; cam.position.set(...p); controls.target.set(...t); };
goView(0);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.setSize(w,h,false); cam.aspect=w/h; cam.fov=Math.max(28,Math.min(48,30*1.3/Math.min(cam.aspect,1.3))); cam.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const TAGS=[['esp','ESP32-S3 + đế nóc'],['tft','Màn TFT 1.8"'],['tof','TOF050C'],['sht','SHT31'],['mx','MX1508'],['bus','Thanh nguồn'],['amp','MAX98357A'],['spk','Loa 3W'],
  ['chg','Mạch sạc'],['sw','Công tắc'],['mic','Mic INMP441'],['irtx','IR phát'],['irrx','IR thu'],['touch','Nút chạm'],['cam','Camera OV3660']];
const tagsEl=document.getElementById('tags'); let showTags=true;
const tags=TAGS.map(([id,t])=>{ const d=document.createElement('div'); d.className='tag'; d.textContent=t; tagsEl.appendChild(d); return {id,d}; });
const tmp=new THREE.Vector3();
const ray=new THREE.Raycaster(); const skip=new Set(); for(const id of [...frameIds,...trackIds]) parts[id].traverse(o=>skip.add(o)); WIRES.forEach(w=>skip.add(w));
const occ=[]; world.traverse(o=>{ if(o.isMesh && !skip.has(o)) occ.push(o); }); roofG.traverse(o=>{ if(o.isMesh && !occ.includes(o)) occ.push(o); });
const hiddenBy={}; let frameN=0;
function occlusion(){ for(const t of tags){ const g=allMods[t.id]; const p=new THREE.Vector3(); g.getWorldPosition(p); const dir=p.clone().sub(cam.position); const dist=dir.length(); ray.set(cam.position, dir.normalize()); ray.far=dist;
  const hit=ray.intersectObjects(occ,false).find(h=>{ let o=h.object; while(o){ if(o===g) return false; o=o.parent; } return true; }); hiddenBy[t.id]=!!(hit && hit.distance<dist-4); } }
function placeTags(){ if(frameN++%8===0) occlusion(); for(const t of tags){ allMods[t.id].getWorldPosition(tmp); tmp.project(cam); const vis=showTags && tmp.z<1 && !hiddenBy[t.id];
  t.d.hidden=!vis; if(vis){ t.d.style.left=((tmp.x+1)/2*innerWidth)+'px'; t.d.style.top=((1-tmp.y)/2*innerHeight)+'px'; } } }

const NAMES={red:'5V, pin +',orange:'3V3',black:'GND',yellow:'I2C SDA',green:'I2C SCL',purple:'SPI màn TFT',blue:'I2S mic + ampli',brown:'Điều khiển motor',white:'Tín hiệu lẻ',grey:'Ra motor, ra loa'};
document.getElementById('legend').innerHTML=Object.entries(NAMES).map(([c,n])=>`<span><i style="background:#${WC[c].toString(16).padStart(6,'0')}"></i>${n}</span>`).join('');
const tg=(id,fn)=>{ const b=document.getElementById(id); b.onclick=()=>{ const v=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',v); fn(v); }; };
tg('bFrame',v=>setVis(frameIds,v)); tg('bTrack',v=>setVis(trackIds,v)); tg('bTags',v=>{ showTags=v; });
document.getElementById('bView').onclick=()=>goView(++vi);

document.getElementById('loading').remove();
function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,cam); placeTags(); }
loop();
window.__setView=(i,tagsOn=true)=>{ goView(i); showTags=tagsOn; controls.update(); renderer.render(scene,cam); frameN=0; placeTags(); };
window.__done=true;
</script>
